name: Build GPU Unlock Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian/Ubuntu Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dpkg-dev libelf-dev

      - name: Run Debian Build
        run: make deb

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-unlock-deb
          path: build/deb/*
