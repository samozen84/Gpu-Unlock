name: Build GPU Unlock Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Packaging Tools & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dpkg-dev libelf-dev linux-headers-generic equivs

      - name: Automatically Resolve and Install Repository Build Deps
        run: |
          # Parse debian/control file and generate a dummy package satisfying its dependencies
          sudo mk-build-deps -i -r -t "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" debian/control

      - name: Run Dedicated Debian Build
        run: |
          # Build the binaries ignoring any unsigned changes signature alerts (-us -uc)
          dpkg-buildpackage -us -uc -b
          
          # Consolidate output binary artifacts
          mkdir -p build/deb
          mv ../gpu-unlock_*.deb build/deb/ 2>/dev/null || mv ../gpu-unlock-*.deb build/deb/ 2>/dev/null

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-unlock-deb
          path: build/deb/*
