name: Build GPU Unlock Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools & Kernel Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev linux-headers-$(uname -r) ruby ruby-dev rubygems
          sudo gem install --no-document fpm

      - name: Download Remote Firmware Inputs
        run: |
          # Fetch the external NVIDIA components required by the project
          make inputs

      - name: Compile Kernel Module Binaries
        run: |
          # Build raw kernel drivers natively
          make KDIR=/lib/modules/$(uname -r)/build

      - name: Bundle into Debian Package File
        run: |
          # Create a mock installation structure
          mkdir -p stage/usr/src/gpu-unlockstage/lib/modules/extramodules
          
          # Stage tracking configuration files
          cp -r * stage/usr/src/gpu-unlock/ || true
          cp firmware/gpu_unlock.bin stage/lib/modules/extramodules/ || true
          
          # Generate clean install package manually via FPM
          mkdir -p build/deb
          fpm -s dir -t deb -n gpu-unlock -v 1.1.0 \
            --architecture amd64 \
            --description "Unlock FP/BF16 instruction issue rate on consumer Nvidia 30 series cards" \
            -p build/deb/gpu-unlock-1.1.0.deb \
            stage/=/

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-unlock-deb
          path: build/deb/*
