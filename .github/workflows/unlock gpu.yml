name: Build GPU Unlock Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-dkms-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Packaging Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems
          sudo gem install --no-document fpm

      - name: Bundle into a DKMS Debian Package
        run: |
          # Create a standard source packaging distribution footprint
          mkdir -p stage/usr/src/gpu-unlock-1.1.0
          
          # Copy source files so they compile directly on the client target machine
          cp -r * stage/usr/src/gpu-unlock-1.1.0/ || true
          
          # Generate a pristine DKMS configuration mapping layout
          cat << 'EOF' > stage/usr/src/gpu-unlock-1.1.0/dkms.conf
          PACKAGE_NAME="gpu-unlock"
          PACKAGE_VERSION="1.1.0"
          BUILT_MODULE_NAME[0]="gpu_unlock"
          DEST_MODULE_LOCATION[0]=/extra
          AUTOINSTALL=yes
          EOF

          # Instantly bundle the source blueprint into an installable file
          mkdir -p build/deb
          fpm -s dir -t deb -n gpu-unlock-dkms -v 1.1.0 \
            --architecture all \
            --depends dkms \
            --description "DKMS source driver package to unlock Nvidia consumer card FP/BF16 issue rates" \
            -p build/deb/gpu-unlock-dkms_1.1.0_all.deb \
            stage/=/

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-unlock-deb
          path: build/deb/*
